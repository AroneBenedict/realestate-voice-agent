name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest --cov --cov-fail-under=90
      - name: Evaluation smoke run
        run: python -m voiceagent.evaluate --calls 50 --out smoke-results
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ matrix.python-version }}
          path: smoke-results/

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t realestate-voice-agent .
      - name: Start the service and call it
        run: |
          docker run -d -p 8000:8000 --name agent realestate-voice-agent
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/calls -H 'content-type: application/json' -d '{}'
